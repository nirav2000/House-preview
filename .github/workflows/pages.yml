name: Deploy and test GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test live app
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          URL="${PAGE_URL}?sha=${GITHUB_SHA}"
          echo "Testing $URL"
          HTML=$(curl -fsSL "${PAGE_URL}index.html?sha=${GITHUB_SHA}")
          grep -q "20260909d" <<<"$HTML"
          BROWSER="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "No Chromium-family browser found on runner"
            exit 1
          fi
          echo "Using browser: $BROWSER"
          for attempt in 1 2 3 4 5 6; do
            set +e
            DOM="$($BROWSER --headless=new --no-sandbox --disable-gpu --virtual-time-budget=20000 --dump-dom "$URL" 2>browser.err)"
            CODE=$?
            set -e
            echo "Attempt $attempt browser exit: $CODE"
            grep -o 'data-selftest="[^"]*"' <<<"$DOM" | head -1 || true
            grep -o 'class="status"[^>]*>[^<]*' <<<"$DOM" | head -1 || true
            if grep -q 'data-selftest="passed"' <<<"$DOM"; then
              echo "Live interaction self-test passed: $URL"
              exit 0
            fi
            cat browser.err || true
            sleep 5
          done
          echo "Live app failed interaction self-test"
          exit 1
