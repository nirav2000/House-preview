<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>House Preview — Staircase Colours</title>
<style>
:root{--bg:#f5f3ee;--panel:#fff;--text:#25231f;--muted:#6f6a62;--border:#d9d4cb;--accent:#315d5a;--accent2:#e8f0ef}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}main{max-width:1180px;margin:auto;padding:16px}.head h1{margin:0 0 4px;font-size:26px}.head p{margin:0 0 16px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:16px;align-items:start}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:12px}.stage{position:relative;overflow:hidden;border-radius:12px;background:#ddd;isolation:isolate}.stage img{display:block;width:100%;height:auto}.paint-layer{position:absolute;inset:0;pointer-events:none;display:none;background:#000;mix-blend-mode:color;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:100% 100%;mask-size:100% 100%}.paint-layer.on{display:block}.controls{display:grid;gap:18px}.group h2{font-size:16px;margin:0 0 8px}.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{min-height:46px;text-align:left;border:1px solid var(--border);border-radius:10px;background:#fff;padding:8px;display:flex;align-items:center;gap:8px;color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent}.choice.active{outline:2px solid var(--accent);outline-offset:1px;background:var(--accent2)}.dot{width:22px;height:22px;border-radius:50%;background:var(--c);border:1px solid #0002;flex:0 0 auto}.custom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;min-height:44px;border:1px solid var(--border);border-radius:10px;padding:7px 10px}.custom input{width:52px;height:36px;border:0;background:none}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.action{min-height:44px;border:1px solid var(--border);border-radius:9px;background:#fff;padding:8px 12px;cursor:pointer}.action.primary{background:var(--accent2)}.status{font-size:13px;color:var(--muted);padding:10px;border-radius:9px;background:#f2f0ea}.legend{display:none;margin-top:8px;font-size:12px;color:var(--muted)}.legend.show{display:block}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#eee;color:#666;font-size:14px;z-index:4}.loading.hidden{display:none}.error{color:#8a1f17}@media(max-width:780px){main{padding:10px}.layout{grid-template-columns:1fr}.presets{grid-template-columns:1fr 1fr}}@media(max-width:380px){.presets{grid-template-columns:1fr}}
</style>
</head>
<body data-selftest="pending"><main>
<div class="head"><h1>House Preview</h1><p>Interactive staircase colour preview. The handrail starts as the original dark reddish timber.</p></div>
<div class="layout">
<section class="card">
<div class="stage" id="stage">
<img id="photo" src="assets/staircase.avif?v=20260909f" alt="Staircase colour preview">
<div class="paint-layer" id="banLayer"></div>
<div class="paint-layer" id="railLayer"></div>
<div class="loading" id="loading">Loading staircase…</div>
</div>
<div class="toolbar"><button class="action" id="inspect" type="button">Inspect masks</button><button class="action" id="reset" type="button">Reset</button><button class="action primary" id="save" type="button">Save PNG</button></div>
<div class="legend" id="legend">Magenta = banister mask · Cyan = handrail mask</div>
</section>
<section class="card controls">
<div class="group"><h2>Banisters</h2><div class="presets" id="banPresets">
<button class="choice active" data-c="original" data-n="Atomic Red" type="button"><span class="dot" style="--c:#BD2520"></span>Atomic Red</button>
<button class="choice" data-c="#7E3B3A" data-n="Geisha 410" type="button"><span class="dot" style="--c:#7E3B3A"></span>Geisha 410</button>
<button class="choice" data-c="#8B3040" data-n="Warm Ruby" type="button"><span class="dot" style="--c:#8B3040"></span>Warm Ruby</button>
<button class="choice" data-c="#B18432" data-n="Mustard" type="button"><span class="dot" style="--c:#B18432"></span>Mustard</button>
<button class="choice" data-c="#515F5F" data-n="Squid Ink" type="button"><span class="dot" style="--c:#515F5F"></span>Squid Ink</button>
<button class="choice" data-c="#626747" data-n="Olive" type="button"><span class="dot" style="--c:#626747"></span>Olive</button>
<button class="choice" data-c="#57414E" data-n="Aubergine" type="button"><span class="dot" style="--c:#57414E"></span>Aubergine</button>
<button class="choice" data-c="#AD813B" data-n="Ochre" type="button"><span class="dot" style="--c:#AD813B"></span>Ochre</button>
</div><label class="custom">Custom banister <input id="banCustom" type="color" value="#7E3B3A"></label></div>
<div class="group"><h2>Handrail</h2><div class="presets" id="railPresets">
<button class="choice active" data-c="original" data-n="Original dark reddish timber" type="button"><span class="dot" style="--c:#5b2b1d"></span>Original timber</button>
<button class="choice" data-c="#6B2D24" data-n="Mahogany" type="button"><span class="dot" style="--c:#6B2D24"></span>Mahogany</button>
<button class="choice" data-c="#604331" data-n="Walnut" type="button"><span class="dot" style="--c:#604331"></span>Walnut</button>
<button class="choice" data-c="#A87543" data-n="Natural oak" type="button"><span class="dot" style="--c:#A87543"></span>Natural oak</button>
<button class="choice" data-c="#C99A63" data-n="Pale oak" type="button"><span class="dot" style="--c:#C99A63"></span>Pale oak</button>
<button class="choice" data-c="#292A28" data-n="Charcoal" type="button"><span class="dot" style="--c:#292A28"></span>Charcoal</button>
</div><label class="custom">Custom handrail <input id="railCustom" type="color" value="#6B2D24"></label></div>
<div class="status" id="status">Loading…</div>
</section></div>
</main>
<script>
(()=>{
'use strict';
const VERSION='20260909f', photo=document.getElementById('photo'), banLayer=document.getElementById('banLayer'), railLayer=document.getElementById('railLayer'), status=document.getElementById('status'), loading=document.getElementById('loading');
let ban='original',banName='Atomic Red',rail='original',railName='Original dark reddish timber',inspect=false;
const BAN_MASK='url("assets/banister-mask.png?v='+VERSION+'")', RAIL_MASK='url("assets/handrail-mask.png?v='+VERSION+'")';
function setMask(el,url){el.style.webkitMaskImage=url;el.style.maskImage=url}
setMask(banLayer,BAN_MASK);setMask(railLayer,RAIL_MASK);
function apply(){if(inspect){banLayer.classList.add('on');railLayer.classList.add('on');banLayer.style.backgroundColor='#ff00c8';railLayer.style.backgroundColor='#00e5ff';banLayer.style.mixBlendMode='normal';railLayer.style.mixBlendMode='normal';banLayer.style.opacity='.6';railLayer.style.opacity='.6'}else{banLayer.style.mixBlendMode='color';railLayer.style.mixBlendMode='color';banLayer.style.opacity='1';railLayer.style.opacity='1';if(ban==='original'){banLayer.classList.remove('on')}else{banLayer.classList.add('on');banLayer.style.backgroundColor=ban}if(rail==='original'){railLayer.classList.remove('on')}else{railLayer.classList.add('on');railLayer.style.backgroundColor=rail}}status.textContent=(inspect?'Mask inspection enabled · ':'')+banName+' banisters · '+railName+' handrail · '+photo.naturalWidth+'×'+photo.naturalHeight+' source'}
function activate(group,btn){group.querySelectorAll('.choice').forEach(x=>x.classList.toggle('active',x===btn))}
document.getElementById('banPresets').addEventListener('click',e=>{const b=e.target.closest('.choice');if(!b)return;ban=b.dataset.c;banName=b.dataset.n;activate(e.currentTarget,b);apply()});
document.getElementById('railPresets').addEventListener('click',e=>{const b=e.target.closest('.choice');if(!b)return;rail=b.dataset.c;railName=b.dataset.n;activate(e.currentTarget,b);apply()});
document.getElementById('banCustom').addEventListener('input',e=>{ban=e.target.value;banName='Custom '+ban.toUpperCase();document.querySelectorAll('#banPresets .choice').forEach(x=>x.classList.remove('active'));apply()});
document.getElementById('railCustom').addEventListener('input',e=>{rail=e.target.value;railName='Custom '+rail.toUpperCase();document.querySelectorAll('#railPresets .choice').forEach(x=>x.classList.remove('active'));apply()});
document.getElementById('inspect').addEventListener('click',e=>{inspect=!inspect;e.currentTarget.textContent=inspect?'Hide masks':'Inspect masks';document.getElementById('legend').classList.toggle('show',inspect);apply()});
document.getElementById('reset').addEventListener('click',()=>{ban='original';banName='Atomic Red';rail='original';railName='Original dark reddish timber';inspect=false;document.getElementById('inspect').textContent='Inspect masks';document.getElementById('legend').classList.remove('show');activate(document.getElementById('banPresets'),document.querySelector('#banPresets [data-c="original"]'));activate(document.getElementById('railPresets'),document.querySelector('#railPresets [data-c="original"]'));apply()});
function loadImage(src){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src})}
async function savePng(){try{const [base,bm,rm]=await Promise.all([loadImage(photo.src),loadImage('assets/banister-mask.png?v='+VERSION),loadImage('assets/handrail-mask.png?v='+VERSION)]);const w=base.naturalWidth,h=base.naturalHeight,c=document.createElement('canvas'),x=c.getContext('2d');c.width=w;c.height=h;x.drawImage(base,0,0,w,h);const paint=async(color,mask)=>{if(color==='original')return;const t=document.createElement('canvas'),tx=t.getContext('2d');t.width=w;t.height=h;tx.fillStyle=color;tx.fillRect(0,0,w,h);tx.globalCompositeOperation='destination-in';tx.drawImage(mask,0,0,w,h);x.save();x.globalCompositeOperation='color';x.drawImage(t,0,0);x.restore()};await paint(ban,bm);await paint(rail,rm);const a=document.createElement('a');a.download='staircase-colour-preview.png';a.href=c.toDataURL('image/png');a.click()}catch(e){status.textContent='Could not save this preview.'}}
document.getElementById('save').addEventListener('click',savePng);
async function selfTest(){try{const supportsMask=CSS.supports('mask-image','url("x")')||CSS.supports('-webkit-mask-image','url("x")');const supportsBlend=CSS.supports('mix-blend-mode','color');const samples=[];for(const n of ['Geisha 410','Olive','Mustard']){document.querySelector('#banPresets [data-n="'+n+'"]').click();samples.push(getComputedStyle(banLayer).backgroundColor+'|'+getComputedStyle(banLayer).display)}const unique=new Set(samples).size===3;const passed=supportsMask&&supportsBlend&&unique&&photo.naturalWidth>=600&&photo.naturalHeight>=1000;document.body.dataset.selftest=passed?'passed':'failed';document.body.dataset.selftestDetail=samples.join(';');document.body.dataset.sourceSize=photo.naturalWidth+'x'+photo.naturalHeight;document.body.dataset.maskSupport=String(supportsMask);window.__HOUSE_PREVIEW_SELFTEST__={passed,supportsMask,supportsBlend,samples,source:[photo.naturalWidth,photo.naturalHeight]};document.getElementById('reset').click()}catch(e){document.body.dataset.selftest='failed';document.body.dataset.selftestDetail='error';window.__HOUSE_PREVIEW_SELFTEST__={passed:false,error:String(e)}}}
photo.addEventListener('load',()=>{loading.classList.add('hidden');apply();selfTest()},{once:true});photo.addEventListener('error',()=>{loading.textContent='Could not load staircase image.';status.classList.add('error');document.body.dataset.selftest='failed'},{once:true});if(photo.complete&&photo.naturalWidth){loading.classList.add('hidden');apply();selfTest()}
})();
</script>
</body>
</html>
